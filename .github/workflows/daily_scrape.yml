name: Daily Civil Service Jobs Scraper

on:
  schedule:
    # Runs every day at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run incremental scrape
        run: |
          python main.py scrape --mode incremental

      - name: Export SQL dump
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('data/jobs.db')
          with open('data/export_dump.sql', 'w') as f:
              for line in conn.iterdump():
                  f.write(f'{line}\n')
          "

      - name: Commit and push database updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db data/export_dump.sql
          if git diff --staged --quiet; then
            echo "No new jobs to commit today."
          else
            git commit -m "Auto-update: daily scraped jobs $(date -u +'%Y-%m-%d')"
            git push
          fi
