version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civil-service-jobs-scraper
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8765:8000"
    environment:
      PORT: 8000
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
